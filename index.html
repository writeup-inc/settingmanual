<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="ライトアップの各AI SaaSについて、導入後の初期設定マニュアルをまとめた一覧です。">
<title>初期設定マニュアル一覧｜株式会社ライトアップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&amp;family=Noto+Sans+JP:wght@400;700;900&amp;display=swap" rel="stylesheet">
<style>
:root{
  --ink:#101214;--paper:#FFFFFF;--g90:#1F2225;--g60:#5F666C;--g40:#949A9F;
  --g20:#D7DBDE;--g08:#EBEEF0;--g04:#F5F7F8;--accent:#1F4E66;--accent-soft:#E8F0F4;
  --jp:"Noto Sans JP",sans-serif;--en:"Inter",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--ink:#F2F4F5;--paper:#101214;--g90:#E3E6E8;--g60:#A2A9AF;--g40:#71787E;
    --g20:#333A3F;--g08:#20252A;--g04:#181C20;--accent:#8FC4DD;--accent-soft:#17262E;}
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--jp);color:var(--ink);background:var(--paper);line-height:1.95;
  font-size:16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:0 28px}
a{color:inherit}
.hero{padding:80px 0 44px;border-bottom:1px solid var(--ink)}
.eyebrow{font-family:var(--en);font-size:11px;font-weight:900;letter-spacing:.18em;color:var(--g60);
  margin-bottom:18px;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--ink)}
h1{font-size:clamp(24px,3.8vw,38px);font-weight:900;line-height:1.35;letter-spacing:-.02em;margin-bottom:18px}
.lead{font-size:15px;line-height:2.05;color:var(--g90);max-width:640px}
.list{padding:40px 0 0;list-style:none}
.item{border:1px solid var(--g20);margin-bottom:14px;transition:.2s}
.item:hover{border-color:var(--ink)}
.item a{display:flex;align-items:center;gap:18px;padding:22px 24px;text-decoration:none}
.item .no{font-family:var(--en);font-size:11px;font-weight:900;letter-spacing:.1em;color:var(--paper);
  background:var(--ink);padding:5px 10px;flex:0 0 auto}
.item .body{flex:1;min-width:0}
.item b{display:block;font-size:17px;font-weight:900;line-height:1.5}
.item p{font-size:13px;color:var(--g60);line-height:1.8;margin-top:3px}
.item .meta{font-family:var(--en);font-size:11px;font-weight:700;color:var(--g40);letter-spacing:.06em;
  margin-top:8px;display:block}
.item .arw{width:17px;height:17px;color:var(--g40);flex:0 0 auto}
.ft{padding:44px 0 60px;margin-top:44px;border-top:1px solid var(--ink);
  display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:baseline}
.ft b{font-size:13px;font-weight:900;letter-spacing:.06em}
.ft span{font-size:11.5px;color:var(--g60)}
@media (max-width:640px){
  .item a{flex-wrap:wrap;gap:12px}
  .item .arw{display:none}
}
</style>
</head>
<body>

<section class="hero">
  <div class="wrap">
    <div class="eyebrow">WRITEUP ／ SETUP MANUAL</div>
    <h1>初期設定マニュアル一覧</h1>
    <p class="lead">ライトアップの各AI SaaSについて、導入後にお客様ご自身で進めていただく初期設定のマニュアルをまとめています。最終更新の新しい順に並べています。</p>
  </div>
</section>

<div class="wrap">
  <ul class="list" id="list">
    <li class="item" data-updated="2026-09-09T11:00+09:00">
      <a href="./supermanager/">
        <span class="no">01</span>
        <span class="body">
          <b>スーパーマネージャー</b>
          <p>拡張機能の追加とログイン、商談同席機能の設定、文字起こし、Googleドライブへの商談ログ保存まで。所要時間の目安は合計20〜25分。</p>
          <span class="meta">UPDATED 2026-09-09</span>
        </span>
        <svg class="arw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
      </a>
    </li>
  </ul>

  <div class="ft">
    <b>株式会社ライトアップ</b>
    <span>URLを知っている方のみ閲覧できます（検索結果には表示されません）</span>
  </div>
</div>

<script>
(function(){
  var list = document.getElementById("list");
  var items = [].slice.call(list.children);
  items.sort(function(a, b){
    return (b.dataset.updated || "").localeCompare(a.dataset.updated || "");
  }).forEach(function(el, i){
    list.appendChild(el);
    var no = el.querySelector(".no");
    if (no) no.textContent = ("0" + (i + 1)).slice(-2);
  });
})();
</script>

</body>
</html>
